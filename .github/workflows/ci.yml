name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run test suite (unit + C compile + C runtime)
        # gcc is preinstalled on ubuntu-latest; the SPIN test self-skips where
        # the `spin` binary is absent.
        run: python -m pytest -v

  compile-sample:
    # Belt-and-suspenders: compile a freshly generated protocol with -Werror.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: |
          python gen_protocol.py --seed dcc7305fb7b8b2ea66154e81c2f36daf -o out/ci
          gcc -std=c99 -Wall -Wextra -Werror -c out/ci/*.c -o out/ci.o
