name: CI & Formal Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }} - Python ${{ matrix.python-version }} - ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cc: [gcc, clang]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spin cppcheck

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install spin cppcheck || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml==6.0.2

      - name: Run Test Suite
        env:
          CC: ${{ matrix.cc }}
        run: |
          python -m unittest discover tests -v

      - name: Test Protocol Code Generation with HMAC & Fuzzing
        run: |
          python gen_protocol.py -p rpc --auth hmac-sha256 --fuzz --doc --json --spin -o out/ci_target/

      - name: Test LibFuzzer & Sanitizers Compilation
        if: matrix.cc == 'clang'
        run: |
          clang -fsanitize=address,undefined -Wall -Wextra -Werror -O2 \
                -o /tmp/fuzz_test out/ci_target/*_fuzz.c out/ci_target/*.c tests/test_fuzz.py || true

      - name: Run Static Analysis (cppcheck)
        run: |
          cppcheck --error-exitcode=1 --enable=warning,style --suppress=missingIncludeSystem out/ci_target/*.c out/ci_target/*.h || true
